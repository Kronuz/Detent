<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A rotary knob with detent notches: the dial clicks into discrete,
       stable positions, which is what a runtime knob does for a process. -->
  <g fill="none" stroke="#7aa83e" stroke-width="3.2" stroke-linecap="round">
    <line x1="32" y1="3.5" x2="32" y2="9" />
    <line x1="52.2" y1="11.8" x2="48.3" y2="15.7" />
    <line x1="60.5" y1="32" x2="55" y2="32" />
    <line x1="52.2" y1="52.2" x2="48.3" y2="48.3" />
    <line x1="11.8" y1="52.2" x2="15.7" y2="48.3" />
    <line x1="3.5" y1="32" x2="9" y2="32" />
    <line x1="11.8" y1="11.8" x2="15.7" y2="15.7" />
  </g>
  <circle cx="32" cy="32" r="19" fill="#5d8a2c" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="#294012" stroke-opacity="0.35" stroke-width="2" />
  <circle cx="32" cy="32" r="12.5" fill="#689137" />
  <line x1="32" y1="32" x2="44.7" y2="19.3" stroke="#f4f9ec" stroke-width="4" stroke-linecap="round" />
  <circle cx="32" cy="32" r="3" fill="#f4f9ec" />
</svg>
