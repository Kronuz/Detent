syntax = "proto3";
package detent_codec_trial;
option optimize_for = LITE_RUNTIME;
message Override { string name = 1; oneof value { sint64 forced = 2; uint32 rollout = 3; } }
message Knob { string name = 1; sint64 default_value = 2; optional uint32 rollout = 3; optional sint64 rollout_value = 4; repeated Override overrides = 5; }
message Snapshot { uint64 revision = 1; repeated Knob knobs = 2; }
