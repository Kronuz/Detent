name: TLS and process lifecycle diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic profile
        type: choice
        options: [certificates, managed, writers, coordinator]
        default: certificates
      repetitions:
        description: Process repetitions (1 to 1000)
        type: number
        default: 100
      parallel_runs:
        description: Concurrent process drivers (1 to 4)
        type: number
        default: 1
permissions:
  contents: read
jobs:
  coordinator:
    if: inputs.mode == 'coordinator'
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      REPETITIONS: ${{ inputs.repetitions }}
      PARALLEL_RUNS: ${{ inputs.parallel_runs }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure the matrix Intel macOS profile
        run: |
          brew install llvm
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            '-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g' \
            '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE' \
            -DDETENT_BUILD_AUTHORITY=ON -DDETENT_BUILD_RELAY=ON \
            -DDETENT_BUILD_MANAGED_AGENT=ON -DDETENT_BUILD_BENCHMARKS=OFF
      - name: Build the composed coordinator fixture
        run: cmake --build build --parallel 4 --target test_delivery_coordinator
      - name: Generate certificates
        run: ctest --test-dir build --output-on-failure -R '^delivery_tls_certificates$'
      - name: Repeat large HTTP publication with cleanup diagnostics
        run: |
          [[ "$REPETITIONS" =~ ^[0-9]+$ ]] && (( REPETITIONS >= 1 && REPETITIONS <= 1000 ))
          [[ "$PARALLEL_RUNS" =~ ^[0-9]+$ ]] && (( PARALLEL_RUNS >= 1 && PARALLEL_RUNS <= 4 ))
          drivers=()
          for ((driver=1; driver<=PARALLEL_RUNS; driver++)); do
            ctest --test-dir build --verbose --output-on-failure --no-tests=error \
              -R '^test_delivery_coordinator_subscription-relay-http-500000$' -FA delivery_tls \
              --repeat "until-fail:$REPETITIONS" > "coordinator-$driver.log" 2>&1 &
            drivers+=("$!")
          done
          result=0
          for driver in "${drivers[@]}"; do
            wait "$driver" || result=1
          done
          for logfile in coordinator-*.log; do
            tail -n 120 "$logfile"
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinator-cleanup-diagnostics
          path: coordinator-*.log
  certificates:
    if: inputs.mode == 'certificates'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure the TLS fixture profile
        run: |
          brew install llvm openssl@3
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DDETENT_BUILD_AUTHORITY=ON -DDETENT_BUILD_RELAY=ON \
            -DDETENT_BUILD_BENCHMARKS=OFF
      - name: Generate certificates
        run: ctest --test-dir build --verbose --output-on-failure -R '^(authority_tls_certificates|delivery_tls_certificates)$'
      - name: Inspect the public certificate chain
        run: |
          grep -E '^(DETENT_.*TEST_OPENSSL|OPENSSL_.*LIBRARY|OPENSSL_INCLUDE_DIR):' build/CMakeCache.txt
          verifier="$(brew --prefix openssl@3)/bin/openssl"
          "$verifier" version -a
          for component in detent_authority detent_delivery; do
            directory="build/tests/$component/tls-fixture"
            "$verifier" x509 -in "$directory/ca.pem" -noout -text
            "$verifier" x509 -in "$directory/one.pem" -noout -text
            "$verifier" verify -x509_strict -auth_level 2 -purpose sslserver -CAfile "$directory/ca.pem" "$directory/one.pem"
            "$verifier" verify -x509_strict -auth_level 2 -purpose sslclient -CAfile "$directory/ca.pem" "$directory/one.pem"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-test-certificates
          path: |
            build/tests/detent_authority/tls-fixture/*.pem
            build/tests/detent_delivery/tls-fixture/*.pem
  managed:
    if: inputs.mode == 'managed' || inputs.mode == 'writers'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: ${{ inputs.mode == 'writers' && 'gcc-13' || 'clang-18' }}
      CXX: ${{ inputs.mode == 'writers' && 'g++-13' || 'clang++-18' }}
      MODE: ${{ inputs.mode }}
      REPETITIONS: ${{ inputs.repetitions }}
      PARALLEL_RUNS: ${{ inputs.parallel_runs }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure the managed-process profile
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            '-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g' \
            '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g -D_GLIBCXX_ASSERTIONS' \
            -DDETENT_BUILD_AUTHORITY=ON -DDETENT_BUILD_RELAY=ON \
            -DDETENT_BUILD_MANAGED_AGENT=ON -DDETENT_BUILD_BENCHMARKS=OFF
      - name: Build the real service and reader binaries
        run: |
          if [[ "$MODE" == writers ]]; then
            cmake --build build --parallel 4 --target detentd
          else
            cmake --build build --parallel 4 --target detentd detent-agent detent-reader
            test -x build/src/detent
          fi
      - name: Generate certificates
        run: |
          if [[ "$MODE" == writers ]]; then
            ctest --test-dir build --output-on-failure -R '^authority_tls_certificates$'
          else
            ctest --test-dir build --output-on-failure -R '^delivery_tls_certificates$'
          fi
      - name: Repeat managed delivery through restart and reset
        run: |
          [[ "$REPETITIONS" =~ ^[0-9]+$ ]] && (( REPETITIONS >= 1 && REPETITIONS <= 1000 ))
          [[ "$PARALLEL_RUNS" =~ ^[0-9]+$ ]] && (( PARALLEL_RUNS >= 1 && PARALLEL_RUNS <= 4 ))
          fixture=delivery_tls
          pattern='^test_managed_delivery_process$'
          if [[ "$MODE" == writers ]]; then
            fixture=authority_tls
            pattern='^test_system_authority_writer_failover$'
          fi
          drivers=()
          for ((driver=1; driver<=PARALLEL_RUNS; driver++)); do
            ctest --test-dir build --output-on-failure --no-tests=error \
              -R "$pattern" -FA "$fixture" \
              --repeat "until-fail:$REPETITIONS" > "$MODE-$driver.log" 2>&1 &
            drivers+=("$!")
          done
          result=0
          for driver in "${drivers[@]}"; do
            wait "$driver" || result=1
          done
          for logfile in "$MODE"-*.log; do
            printf '=== %s ===\n' "$logfile"
            tail -n 120 "$logfile"
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.mode }}-process-repetition-logs
          path: |
            managed-*.log
            writers-*.log
          if-no-files-found: ignore
